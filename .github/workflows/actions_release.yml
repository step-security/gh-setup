name: Release GitHub Actions

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag for the release"
        required: true
      additional_assets:
        description: "Include additional binary assets in the release"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  assets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Check out source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Create local tag for GoReleaser
        run: git tag "${{ github.event.inputs.tag }}"

      - name: Build assets with GoReleaser
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          distribution: goreleaser
          version: latest
          args: release --clean --skip=publish
        env:
          GORELEASER_CURRENT_TAG: ${{ github.event.inputs.tag }}

      - name: Prepare required binaries
        run: |
          TAG="${{ github.event.inputs.tag }}"
          VERSION="${TAG#v}"

          mkdir -p upload-assets
          cp dist/gh-setup-linux_linux_amd64_v1/gh-setup upload-assets/gh-setup_v${VERSION}_linux_amd64
          cp dist/gh-setup-linux_linux_arm64_v8.0/gh-setup upload-assets/gh-setup_v${VERSION}_linux_arm64
          cp dist/gh-setup-darwin_darwin_amd64_v1/gh-setup upload-assets/gh-setup_v${VERSION}_darwin_amd64
          cp dist/gh-setup-darwin_darwin_arm64_v8.0/gh-setup upload-assets/gh-setup_v${VERSION}_darwin_arm64
          cp dist/gh-setup-windows_windows_amd64_v1/gh-setup.exe upload-assets/gh-setup_v${VERSION}_windows_amd64.exe

      - name: Upload binaries as workflow artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: additional-release-assets
          path: upload-assets/

  release:
    needs: assets
    permissions:
      actions: read
      id-token: write
      contents: write

    uses: step-security/reusable-workflows/.github/workflows/actions_release.yaml@v1
    with:
      tag: "${{ github.event.inputs.tag }}"
      additional_assets: ${{ inputs.additional_assets }}
